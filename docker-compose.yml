services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: democracyonline
      POSTGRES_USER: democracyonline
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U democracyonline -d democracyonline"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: democracyonline-${DEPLOYED_ENV:?Set DEPLOYED_ENV in .env}:local
    build:
      context: .
      args:
        BUILD_NODE_HEAP_MB: ${BUILD_NODE_HEAP_MB:-4096}
        VITE_COMMIT_SHA: ${DEPLOY_COMMIT_SHA:-}
        VITE_INSTANCE_CONFIG: ${VITE_INSTANCE_CONFIG:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      VITE_INSTANCE_CONFIG: ${VITE_INSTANCE_CONFIG:-}
    ports:
      - "127.0.0.1:${APP_PORT:?Set APP_PORT in .env}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s
    networks:
      - web
      - database
    restart: unless-stopped

  election-scheduler:
    image: democracyonline-${DEPLOYED_ENV:?Set DEPLOYED_ENV in .env}:local
    env_file: .env
    environment:
      APP_BASE_URL: http://app:3000
    command: ["node", "/usr/src/app/scripts/scheduler.mjs"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped

  migrator:
    profiles: ["tools"]
    build:
      context: .
      target: tooling
    env_file: .env
    environment:
      VITE_INSTANCE_CONFIG: ${VITE_INSTANCE_CONFIG:-}
    command: ["bun", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database

volumes:
  db_data:

networks:
  web:
  database:
    internal: true
